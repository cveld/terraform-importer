[project]
name = "generate-imports-from-plan"
version = "0.1.0"
description = "Generate Terraform import blocks directly from a binary .plan file"
requires-python = ">=3.11"
dependencies = ["msgpack>=1.0"]

[project.scripts]
generate-imports = "generate_imports:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generate_imports"]
