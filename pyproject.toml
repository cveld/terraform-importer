[project]
name = "generate-imports-from-plan"
version = "0.3.1"
description = "Generate Terraform import blocks directly from a binary .plan file"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "msgpack>=1.0",
    "python-hcl2>=8.1.2",
]

[project.urls]
Repository = "https://github.com/cveld/terraform-importer"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
generate-imports-from-plan = "generate_imports:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generate_imports"]
